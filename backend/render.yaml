services:
  - type: web
    name: glamai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SMTP_EMAIL
        sync: false        # set this manually in Render dashboard
      - key: SMTP_PASSWORD
        sync: false        # set this manually in Render dashboard
      - key: OWNER_EMAIL
        sync: false        # set this manually in Render dashboard
